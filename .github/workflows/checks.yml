name: Python checks
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r vps/requirements.txt
      - run: python -I vps/test_service.py
      - run: python -I clone/test_miraimind.py
